<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Round Robin UI</title>
    <style>
        /* Стильный и простой дизайн (CSS) */
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 320px;
        }
        h2 {
            text-align: center;
            color: #4CAF50;
            margin-top: 0;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            background: #3c3c3c;
            border: 1px solid #555;
            color: #fff;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Round Robin</h2>
        <form>
            <div class="input-group">
                <label for="processes">Список процессов:</label>
                <input type="text" id="processes" placeholder="P1, P2, P3">
            </div>
            <div class="input-group">
                <label for="burst">Время выполнения (Burst Time):</label>
                <input type="text" id="burst" placeholder="10, 5, 8">
            </div>
            <div class="input-group">
                <label for="quantum">Квант времени (Quantum):</label>
                <input type="number" id="quantum" placeholder="3">
            </div>
            <button type="submit">Запустить расчет</button>
        </form>
    </div>

</body>
</html>
